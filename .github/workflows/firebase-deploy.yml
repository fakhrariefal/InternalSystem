name: Auto Update & Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript & Firestore Rules Check
        run: |
          npm run lint
          npm test
          npm run rules:lint

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy Firestore Rules & Firebase Hosting
        uses: w9jds/firebase-action@v15.4.0
        with:
          args: deploy --project gen-lang-client-0621052252 --only firestore:rules,hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
