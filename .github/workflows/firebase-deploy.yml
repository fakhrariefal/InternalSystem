name: Auto Update & Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Jika sudah commit package-lock.json ke repo, aktifkan kembali baris di bawah ini:
          # cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript & Firestore Rules Check
        env:
          CI: true
        run: |
          npm run lint
          npm test -- --watchAll=false || npm test
          npm run rules:lint

      - name: Build Production Bundle
        run: npm run build
        # Jika aplikasi Anda butuh environment variables saat build (misal VITE_API_KEY), tambahkan di sini:
        # env:
        #   VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Deploy Firestore Rules & Firebase Hosting
        uses: w9jds/firebase-action@v15.4.0
        with:
          args: deploy --project gen-lang-client-0621052252 --only firestore:rules,hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
